name: Mobile Appium CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'MOBILE/**'
      - 'android/qa-automation/**'
      - '.github/workflows/mobile-appium.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'MOBILE/**'
      - 'android/qa-automation/**'
      - '.github/workflows/mobile-appium.yml'
  workflow_dispatch:

jobs:
  android-appium:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install mobile app dependencies
        working-directory: MOBILE
        run: npm install

      - name: Build Android debug APK
        working-directory: MOBILE/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Appium artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-appium-artifacts
          path: |
            MOBILE/android/app/build/outputs/**/*.apk
