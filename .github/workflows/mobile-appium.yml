name: Mobile Appium CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'mobile_app/**'
      - 'android/qa-automation/**'
      - '.github/workflows/mobile-appium.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'mobile_app/**'
      - 'android/qa-automation/**'
      - '.github/workflows/mobile-appium.yml'
  workflow_dispatch:

jobs:
  android-appium:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            mobile_app/package-lock.json
            android/qa-automation/package-lock.json

      - name: Install mobile app dependencies
        working-directory: mobile_app
        run: npm install

      - name: Install Appium automation dependencies
        working-directory: android/qa-automation
        run: npm install

      - name: Build Android debug APK
        working-directory: mobile_app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Run static APK analysis
        working-directory: android/qa-automation
        run: npm run analyze-apk
        continue-on-error: true

      - name: Run Appium tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          script: |
            cd android/qa-automation
            npm run wdio
        continue-on-error: true

      - name: Upload Appium artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-appium-artifacts
          path: |
            android/qa-automation/reports/**
            android/qa-automation/logs/**
            mobile_app/android/app/build/outputs/**/*.apk
