name: Mobile Appium CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  appium-tests:
    name: Appium Mobile Tests (Simulated)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: qa-automation/package-lock.json

      - name: Install QA dependencies
        working-directory: qa-automation
        run: npm install

      - name: Run Appium tests (graceful skip — no device)
        working-directory: qa-automation
        env:
          TEST_ENV: qa
          BASE_URL: https://bluehorizon.blue-horizon.workers.dev
        run: |
          npx mocha "tests/specs/appium-mobile.spec.js" \
            --require tests/hooks/setup.js \
            --require tests/hooks/teardown.js \
            --timeout 120000 \
            --reporter spec
        continue-on-error: true

      - name: Upload Appium report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-report
          path: |
            qa-automation/excel/*.xlsx
            qa-automation/reports/*.xlsx
          retention-days: 30

  android-build:
    name: Android APK Build
    runs-on: ubuntu-latest
    if: ${{ false }}
    # Disabled — requires full Android SDK + Capacitor native build
    # Enable by removing the 'if: false' line when Android environment is ready

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web dependencies
        working-directory: "WEB APP"
        run: npm install

      - name: Build web for Android
        working-directory: "WEB APP"
        run: npm run build

      - name: Sync Capacitor
        working-directory: "WEB APP"
        run: npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blue-horizon-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
