name: Web CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'WEB APP'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            WEB APP/package-lock.json

      - name: Install root dependencies
        run: npm install
        working-directory: .

      - name: Install web dependencies
        run: npm install

      - name: Lint web app
        run: npm run lint
        continue-on-error: true

      - name: Build web app
        run: npm run build

      - name: Upload web build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-app-dist
          path: 'WEB APP/dist'
