name: Validation Test Suite

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test:
    name: Validation Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 'qa-automation/package-lock.json'

      - name: Install QA dependencies
        working-directory: qa-automation
        run: npm install

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run Validation Test Suite
        working-directory: qa-automation
        env:
          TEST_ENV: qa
          BASE_URL: https://bluehorizon.blue-horizon.workers.dev
          BROWSER: chrome
          HEADLESS: true
        run: |
          npx mocha \
            "tests/specs/ui-validation.spec.js" \
            "tests/specs/ui-forms-validation.spec.js" \
            --require tests/hooks/setup.js \
            --require tests/hooks/teardown.js \
            --timeout 120000 \
            --reporter spec
        continue-on-error: true

      - name: Upload Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-validation-report
          path: |
            qa-automation/excel/*.xlsx

          retention-days: 30
