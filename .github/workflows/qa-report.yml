name: QA Report Generator

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["QA Full Test Suite (Selenium + Unit + Load + Security)"]
    types: [completed]

jobs:
  generate-qa-report:
    name: Generate & Publish Excel QA Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: qa-automation/package-lock.json

      - name: Install dependencies
        working-directory: qa-automation
        run: npm install

      - name: Run Unit + Load tests to populate state
        working-directory: qa-automation
        env:
          TEST_ENV: qa
          BASE_URL: https://bluehorizon.blue-horizon.workers.dev
        run: |
          npx mocha \
            "tests/specs/unit-tests.spec.js" \
            "tests/specs/load-tests.spec.js" \
            --require tests/hooks/setup.js \
            --require tests/hooks/teardown.js \
            --timeout 120000 \
            --reporter min
        continue-on-error: true

      - name: Generate standalone Excel report
        working-directory: qa-automation
        run: node utilities/excel-report-generator.js

      - name: Upload Excel QA Report
        uses: actions/upload-artifact@v4
        with:
          name: Blue-Horizon-QA-Excel-Report
          path: |
            qa-automation/excel/Blue_Horizon_Master_Test_Report.xlsx
            qa-automation/reports/Blue_Horizon_Master_Test_Report.xlsx
          retention-days: 90
