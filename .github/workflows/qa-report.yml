name: QA Report Generator

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    paths:
      - 'qa-reporting/**'
      - 'docs/testing/**'

jobs:
  generate-qa-report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-reporting

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: qa-reporting/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate Excel QA report
        run: npm run generate-report

      - name: Upload QA report artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-test-report
          path: qa-reporting/reports/Blue_Horizon_Test_Report.xlsx
