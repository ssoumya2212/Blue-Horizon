name: Android QA Automation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest # macOS runners support hardware acceleration for Android Emulator

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        env:
          ORG_GRADLE_PROJECT_isCI: true

      - name: Install QA Automation Dependencies
        working-directory: ./qa-automation
        run: npm install

      - name: Run Static APK Analysis
        working-directory: ./qa-automation
        run: npm run analyze-apk

      - name: Run Appium Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_4
          script: |
            cd qa-automation
            npm run wdio

      - name: Run MobSF Security Scan
        uses: MobSF/mobsf-github-actions@v1.0.4
        with:
          file: app/build/outputs/apk/debug/app-debug.apk
          scan_type: apk

      - name: Upload Test Report & Evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: mobile-test-report
          path: |
            qa-automation/reports/mobile-test-report.xlsx
            qa-automation/reports/**/*.png
            qa-automation/logs/

      - name: Upload MobSF Scan Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: mobsf-report
          path: mobsf-report.pdf
